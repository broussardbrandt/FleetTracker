<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Live positions of the TDI-Brooks International research vessel fleet."
    />
    <title>TDI-Brooks Fleet Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>TDI-Brooks <span>Fleet</span></h1>
        <div class="sub">Last reported positions for five research vessels · UTC</div>
        <div class="hdr-right">
          <button id="fitBtn" type="button">Show whole fleet</button>
        </div>
      </header>
      <div class="main">
        <div class="chart" id="chart">
          <svg
            id="map"
            role="img"
            aria-label="Chart showing last reported positions of the TDI-Brooks fleet"
          ></svg>
          <div class="zoom">
            <button id="zin" type="button" aria-label="Zoom in">+</button
            ><button id="zout" type="button" aria-label="Zoom out">−</button>
          </div>
          <div class="callout" id="callout" hidden></div>
          <div class="embed-badge">
            <b>TDI-Brooks Fleet</b
            ><span id="embedBadge">Loading positions…</span>
          </div>
          <div class="scale-note" id="scaleNote">
            Mercator · drag to pan, scroll to zoom
          </div>
        </div>
        <aside>
          <div class="feed" id="feed">
            <span class="dot"></span><span>Loading positions…</span>
          </div>
          <div class="list" id="list"></div>
          <div class="foot">
            Positions refresh every few minutes. A position older than six hours
            is marked aging, and older than two days stale.
          </div>
        </aside>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"
      integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67"
      crossorigin="anonymous"
    ></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
